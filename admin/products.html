<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品管理 | 江南寶卡</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><aside class="sidebar"><a class="brand" href="../index.html"><span>江</span><b>江南寶卡</b></a><nav><a href="index.html">總覽</a><a href="index.html#banners">Banner 與廣告</a><a class="active" href="products.html">商品管理</a><a href="index.html#events">活動與公告</a><a href="index.html#consignment">卡牌寄售</a><a href="index.html#orders">訂單</a></nav><div class="staff"><span class="avatar">商</span><div><b>張商品</b><small>商品編輯</small></div></div></aside><main><header><div><p class="eyebrow">CATALOG</p><h1>商品管理</h1><p class="sub">上架預購與現貨。庫存扣減會在訂單交易完成時處理。</p></div><div class="header-actions"><a href="../index.html" class="ghost" target="_blank">查看官網 ↗</a><button class="primary" id="open-product">＋ 新增商品</button></div></header><section class="metrics"><article><p>已上架商品</p><strong>42</strong><small class="positive">28 項現貨・14 項預購</small></article><article><p>低庫存提醒</p><strong>3</strong><small class="warning">少於 5 件的現貨</small></article><article><p>本月預購訂單</p><strong>86</strong><small>尚未進入扣庫存</small></article><article><p>即將到貨</p><strong>5</strong><small>30 天內預購商品</small></article></section><section class="panel banner-panel"><div class="panel-head"><div><p class="eyebrow">PRODUCT CATALOG</p><h2>商品清單</h2></div><button class="primary" id="open-product-2">＋ 新增商品</button></div><div class="toolbar"><div class="tabs"><button class="selected">全部 <span>42</span></button><button>預購 <span>14</span></button><button>現貨 <span>28</span></button></div><select><option>所有狀態</option><option>已上架</option><option>草稿</option><option>已封存</option></select></div><div class="table-wrap"><table><thead><tr><th>商品</th><th>類型</th><th>售價</th><th>庫存／到貨日</th><th>狀態</th><th></th></tr></thead><tbody id="product-table"></tbody></table></div></section></main><dialog id="product-dialog"><form method="dialog" id="product-form"><header><div><p class="eyebrow">NEW PRODUCT</p><h2>新增商品</h2></div><button class="close" value="cancel">×</button></header><div class="form-grid"><label>商品名稱<input required name="name" placeholder="例如：寶可夢擴充包 BOX"></label><label>SKU<input required name="sku" placeholder="PK-SV-BOX-002"></label><label>類型<select name="kind" id="product-kind"><option value="preorder">預購</option><option value="in_stock">現貨</option></select></label><label>售價（NT$）<input required name="price" type="number" min="0"></label><label id="deposit-field">訂金（NT$）<input name="deposit" type="number" min="0"></label><label id="release-field">預計到貨日<input name="releaseDate" type="date"></label><label id="stock-field" hidden>可售庫存<input name="stock" type="number" min="0"></label><label>狀態<select name="status"><option value="draft">草稿</option><option value="published">上架</option></select></label></div><footer><button class="ghost" value="cancel">取消</button><button class="primary dark" value="default">儲存商品</button></footer></form></dialog><div class="toast" role="status"></div><script src="products.js"></script></body></html>
