<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寄售管理 | 江南寶卡</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="../brand-logo.css"></head>
<body><aside class="sidebar"><a class="brand" href="../index.html"><span>江</span><b>江南寶卡</b></a><nav><a href="index.html">總覽</a><a href="products.html">商品管理</a><a class="active" href="consignment.html">卡牌寄售</a><a href="orders.html">訂單</a></nav></aside><main><p class="connection-state" data-connection-state>展示模式：尚未連接公司 SSO 與正式 API。</p><header><div><p class="eyebrow">CONSIGNMENT</p><h1>卡牌寄售</h1><p class="sub">收件與上架可追溯，售出與款項結算由付款對帳流程決定。</p></div><button class="primary" id="open">＋ 建立案件</button></header><section class="panel"><div class="panel-head"><div><p class="eyebrow">CASE REGISTER</p><h2>寄售案件</h2></div></div><div class="toolbar consignment-toolbar"><label>搜尋案件或寄售人<input id="consignment-search" type="search" placeholder="例如 JC-20260902 或 陳小姐"></label><label>案件狀態<select id="consignment-status"><option value="all">全部狀態</option><option value="submitted">送件</option><option value="received">收件</option><option value="listed">上架</option><option value="returned">退還</option><option value="cancelled">取消</option></select></label></div><p class="sub consignment-filter-summary" id="consignment-filter-summary" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>案件編號</th><th>寄售人</th><th>卡片數</th><th>狀態</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="dialog"><form method="dialog" id="form"><header><div><p class="eyebrow">NEW CASE</p><h2>建立寄售案件</h2></div><button class="close" value="cancel">×</button></header><div class="form-grid"><label>寄售人姓名<input required name="name"></label><label>聯絡方式<input required name="contact"></label><label>卡片名稱<input required name="card"></label><label>品相<select name="condition"><option>NM</option><option>EX</option><option>LP</option></select></label><label>建議售價（NT$）<input required type="number" name="price" min="0"></label></div><footer><button class="ghost" value="cancel">取消</button><button class="primary dark">建立案件</button></footer></form></dialog><div class="toast" role="status"></div><s
