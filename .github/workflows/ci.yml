name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Check JavaScript syntax
        run: |
          node --check server/src/server.js
          node --check server/src/customer-auth.js
          node --check server/src/customer-membership.js
          node --check admin/admin-api.js
          node --check admin/products.js
          node --check admin/content.js
          node --check admin/orders.js
          node --check admin/consignment.js
          node --check member.js
          node --check banner.js
          node --check script.js
          node --check server/scripts/verify-production-config.js
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate API contract
        run: npx --yes @redocly/cli@2.51.1 lint docs/openapi.yaml
      - name: Build migration runner
        run: docker build -f server/Dockerfile.migrate -t jiangnan-ci-migrate server
      - name: Verify migration runner is retry-safe
        run: |
          docker network create jiangnan-migration-ci
          docker run -d --name jiangnan-migration-ci-db --network jiangnan-migration-ci \
            -e POSTGRES_DB=jiangnan_card \
            -e POSTGRES_USER=jiangnan_card \
            -e POSTGRES_PASSWORD=local-development-only \
            postgres:16-alpine
          for attempt in {1..30}; do
            docker exec jiangnan-migration-ci-db pg_isready -U jiangnan_card -d jiangnan_card && break
            sleep 1
          done
          docker run --rm --network jiangnan-migration-ci \
            -e DATABASE_URL=postgresql://jiangnan_card:local-development-only@jiangnan-migration-ci-db:5432/jiangnan_card \
            jiangnan-ci-migrate
          docker run --rm --network jiangnan-migration-ci \
            -e DATABASE_URL=postgresql://jiangnan_card:local-development-only@jiangnan-migration-ci-db:5432/jiangnan_card \
            jiangnan-ci-migrate
          test "$(docker exec jiangnan-migration-ci-db psql -U jiangnan_card -d jiangnan_card -Atqc 'SELECT count(*) FROM schema_migrations')" = "$(find server/db/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          docker exec jiangnan-migration-ci-db createdb -U jiangnan_card jiangnan_legacy
          docker run --rm --network jiangnan-migration-ci --entrypoint /bin/sh \
            -e DATABASE_URL=postgresql://jiangnan_card:local-development-only@jiangnan-migration-ci-db:5432/jiangnan_legacy \
            jiangnan-ci-migrate -c 'for migration in /migrations/*.sql; do [ "$(basename "$migration")" = "017_payment_integration_foundation.sql" ] && break; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done'
          docker run --rm --network jiangnan-migration-ci \
            -e DATABASE_URL=postgresql://jiangnan_card:local-development-only@jiangnan-migration-ci-db:5432/jiangnan_legacy \
            -e MIGRATION_BASELINE=016_customer_policy_consent.sql \
            -e MIGRATION_BASELINE_ACK=existing-schema-verified \
            jiangnan-ci-migrate
          test "$(docker exec jiangnan-migration-ci-db psql -U jiangnan_card -d jiangnan_legacy -Atqc 'SELECT count(*) FROM schema_migrations')" = "$(find server/db/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          test "$(docker exec jiangnan-migration-ci-db psql -U jiangnan_card -d jiangnan_legacy -Atqc "SELECT to_regclass('public.payment_attempts') IS NOT NULL")" = "t"
      - name: Remove migration test environment
        if: always()
        run: |
          docker rm -f jiangnan-migration-ci-db || true
          docker network rm jiangnan-migration-ci || true
      - name: Start isolated integration environment
        run: API_PORT=3300 DB_PORT=55432 docker compose -p jiangnan-ci up -d --build
      - name: Wait for API health check
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3300/health && exit 0
            sleep 2
          done
          exit 1
      - name: Run API integration tests
        run: API_TEST_BASE=http://127.0.0.1:3300 npm test --prefix server
      - name: Show API logs on failure
        if: failure()
        run: docker compose -p jiangnan-ci logs api db
      - name: Remove integration environment
        if: always()
        run: docker compose -p jiangnan-ci down -v
